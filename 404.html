<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CMarie | Portfolio Redirection</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages client-side routing handler
      // This script checks if a redirect is needed and sends the user to the correct sub-route
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to secure application router...
  </body>
</html>
